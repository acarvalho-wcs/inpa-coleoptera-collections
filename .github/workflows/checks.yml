name: Verificar codigo
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: |
          for f in js/*.js server.mjs scripts/*.mjs; do node --check "$f"; done
