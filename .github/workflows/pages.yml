name: Publicar site no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar codigo
        run: npm test
      - name: Verificar configuracao Google OAuth
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if ! [[ "$GOOGLE_OAUTH_CLIENT_ID" =~ ^[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::Configure a variavel GOOGLE_OAUTH_CLIENT_ID em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          cat > config.js <<EOF
          window.INPA_CONFIG = {
            googleClientId: '$GOOGLE_OAUTH_CLIENT_ID',
            driveRootFolderId: '1RdZAIbK9_Hn6o2E_x-vv0HQMpUEeMSxP',
            startingYear: '2026',
            institutionName: 'Coleção Entomológica do INPA',
            mapTiles: true
          };
          EOF
      - name: Preparar site estatico sem dados institucionais
        run: |
          mkdir -p _site
          cp index.html styles.css config.js .nojekyll _site/
          cp -R js _site/js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
